## Registered Integrations

### 1. GitHub (Core)
- **id**: `int-github`
- **purpose**: Source of truth for code, issues, PRs, wiki, actions
- **auth**: GitHub App (installed on mrterryflood-ui/Thriveup)
- **scopes**: repo, issues, pull_requests, actions, contents, metadata
- **webhooks**: push, pull_request, issues, workflow_run, release
- **data_residency**: GitHub Cloud (US)
- **rate_limits**: 5000 req/hr (app), 1000 req/hr (user)
- **contract**: `integrations/contracts/github.openapi.yaml`
- **monitoring**: `integrations/monitors/github-health.yaml`
- **fallback**: Local git mirror (daily bundle)
- **gate_dependencies**: [0, 1, 2, 3, 4, 5] — all gates