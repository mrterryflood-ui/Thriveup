## Integration Classification

| Tier | Description | SLA | Review Cadence |
|------|-------------|-----|----------------|
| **Core** | Mission-critical; failure blocks Gates 3-5 | 99.9% uptime, < 5 min MTTR | Weekly |
| **Standard** | Important; degradation affects velocity | 99.5% uptime, < 30 min MTTR | Bi-weekly |
| **Experimental** | Exploratory; no gate dependency | Best effort | Monthly |

