## Integration Health Checks

Each integration **must** provide:
1. `contracts/*.openapi.yaml` — machine-readable interface
2. `monitors/*-health.yaml` — Prometheus-compatible health rules
3. `fallback.md` — documented degradation procedure
4. `gate_dependencies` — explicit gate coupling

**No integration may be added without all four artifacts.**