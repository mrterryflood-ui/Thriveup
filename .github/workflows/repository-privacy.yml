name: Repository privacy boundary
on:
  push:
  pull_request:
jobs:
  repository-privacy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - run: node --test scripts/repository-privacy.test.mjs
      - run: node scripts/verify-repository-privacy.mjs
