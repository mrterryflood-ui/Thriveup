# Commitment Registry — Phase 0 Foundation

version: "0.1.0"
last_updated: "2026-09-26"

---
## Registry Rules

1. **Every strategic commitment gets a unique `commitment_id`**
2. **Format**: `cmt-{kebab-case-slug}` (e.g., `cmt-travis-county-retreat`)
3. **Status transitions** follow RPLICE gates (see `governance/rplice/gates.md`)
4. **Immutable once created** — corrections via new entry with `supersedes`
5. **All fields required** unless marked optional

