    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "EducationalOrganization",
      "name": "ThriveUp Academy",
      "alternateName": "ThriveUp",
      "description": "Empowering under-resourced communities of all ages with AI mastery, workforce development, and career pipelines.",
      "url": "https://ai-mastery-academy.replit.app/",
      "foundingLocation": {
        "@type": "Place",
        "name": "Austin, TX"
      },
      "areaServed": "United States",
      "audience": {
        "@type": "EducationalAudience",
        "educationalRole": "student",
        "description": "Under-resourced communities of all ages — returning citizens, veterans, single parents, seniors, and youth"
      },
      "hasOfferCatalog": {
        "@type": "OfferCatalog",
        "name": "AI Mastery Curriculum",
        "itemListElement": [
          {"@type": "Course", "name": "AI Explorer", "educationalLevel": "Grades 3-5"},
          {"@type": "Course", "name": "AI Guide", "educationalLevel": "Grades 3-5"},
          {"@type": "Course", "name": "AI Architect", "educationalLevel": "Grades 6-8"},
          {"@type": "Course", "name": "AI Innovator", "educationalLevel": "Grades 9-10"},
          {"@type": "Course", "name": "AI Master", "educationalLevel": "Grades 11-12"}
        ]
      }
    }
    </script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:ital,wght@0,300;0,400;0,500;0,600;0,700;1,400&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
  </head>
  <body>
    <script>
      (function(){
        try {
          var t = localStorage.getItem("theme");
          if (t === "dark" || (!t && window.matchMedia("(prefers-color-scheme: dark)").matches)) {
            document.documentElement.classList.add("dark");
          }
        } catch(e) {}
      })();
    </script>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
    <script>
      (function(){
        document.addEventListener("contextmenu",function(e){e.preventDefault()});
        document.addEventListener("selectstart",function(e){
          if(e.target&&(e.target.tagName==="INPUT"||e.target.tagName==="TEXTAREA"||e.target.isContentEditable))return;
          e.preventDefault();
        });
        document.addEventListener("copy",function(e){
          if(e.target&&(e.target.tagName==="INPUT"||e.target.tagName==="TEXTAREA"||e.target.isContentEditable))return;
          e.preventDefault();
        });
        document.addEventListener("keydown",function(e){
          if((e.ctrlKey||e.metaKey)&&e.shiftKey&&(e.key==="I"||e.key==="i"||e.key==="J"||e.key==="j"||e.key==="C"||e.key==="c"))e.preventDefault();
          if((e.ctrlKey||e.metaKey)&&(e.key==="u"||e.key==="U"||e.key==="s"||e.key==="S"))e.preventDefault();
          if(e.key==="F12")e.preventDefault();
          if((e.ctrlKey||e.metaKey)&&e.key==="a"){
            if(e.target&&(e.target.tagName==="INPUT"||e.target.tagName==="TEXTAREA"))return;
            e.preventDefault();
          }
        });
        document.addEventListener("dragstart",function(e){e.preventDefault()});
      })();
    </script>
  </body>
</html>
