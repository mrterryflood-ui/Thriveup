<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1" />
    <title>AI Mastery Academy - Teaching the First Generation to Guide Their Smartest Classmate</title>
    <meta name="description" content="AI Mastery Academy is a K-12 curriculum platform teaching students to understand, use, and build with AI responsibly. Ethics-first, project-based learning from Explorer to Master." />
    <meta property="og:title" content="AI Mastery Academy" />
    <meta property="og:description" content="Teaching the first generation to guide their smartest classmate. K-12 AI curriculum with gamification, projects, and parent engagement." />
    <meta name="robots" content="noindex, nofollow, noarchive, noimageindex, nosnippet" />
    <meta name="googlebot" content="noindex, nofollow, noarchive, noimageindex, nosnippet" />
    <meta name="author" content="Texas Empowerment Academy" />
    <meta name="copyright" content="Texas Empowerment Academy. All rights reserved." />
    <link rel="icon" type="image/png" href="/favicon.png" />
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:ital,wght@0,200..800;1,200..800&family=Space+Grotesk:wght@300..700&family=JetBrains+Mono:ital,wght@0,100..800;1,100..800&display=swap" rel="stylesheet">
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
    <script>
      (function(){
        document.addEventListener("contextmenu",function(e){e.preventDefault()});
        document.addEventListener("selectstart",function(e){
          if(e.target&&(e.target.tagName==="INPUT"||e.target.tagName==="TEXTAREA"||e.target.isContentEditable))return;
          e.preventDefault();
        });
        document.addEventListener("copy",function(e){
          if(e.target&&(e.target.tagName==="INPUT"||e.target.tagName==="TEXTAREA"||e.target.isContentEditable))return;
          e.preventDefault();
        });
        document.addEventListener("keydown",function(e){
          if((e.ctrlKey||e.metaKey)&&e.shiftKey&&(e.key==="I"||e.key==="i"||e.key==="J"||e.key==="j"||e.key==="C"||e.key==="c"))e.preventDefault();
          if((e.ctrlKey||e.metaKey)&&(e.key==="u"||e.key==="U"||e.key==="s"||e.key==="S"))e.preventDefault();
          if(e.key==="F12")e.preventDefault();
          if((e.ctrlKey||e.metaKey)&&e.key==="a"){
            if(e.target&&(e.target.tagName==="INPUT"||e.target.tagName==="TEXTAREA"))return;
            e.preventDefault();
          }
        });
        document.addEventListener("dragstart",function(e){e.preventDefault()});
      })();
    </script>
  </body>
</html>
